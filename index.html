<style>
  :root {
    --bg:#FCF8F9; --paper:#fff; --ink:#3B2A35; --muted:#84707B; --line:#EBD9E0;
    --rose:#C94468; --rose-soft:#FBE7ED; --lav:#7A6BC4; --lav-soft:#ECE8F8;

      --rose:#EE7A9A; --rose-soft:#3B2330; --lav:#A99BEA; --lav-soft:#2D2743;
      --on-rose:#2A1520; --warn:#F08A7E; --cream:#D8CCB8;

  }
  :root[data-theme="rosa"] { color-scheme: light; --bg:#FCF8F9; --paper:#fff; --ink:#3B2A35; --muted:#84707B; --line:#EBD9E0; --rose:#C94468; --rose-soft:#FBE7ED; --lav:#7A6BC4; --lav-soft:#ECE8F8; --on-rose:#fff; --warn:#B3443A; --cream:#FAF1E1; --fr1:#C94468; --fr2:#7A6BC4; --frline:#D9B8C0; --frdash:rgba(201,68,104,.55); }

  :root[data-theme="menta"] { color-scheme: light; --bg:#F4FAF7; --paper:#fff; --ink:#213A30; --muted:#66837A; --line:#D6EADF; --rose:#26805F; --rose-soft:#DFF2E8; --lav:#D9775A; --lav-soft:#FBE9E2; --on-rose:#fff; --warn:#B3443A; --cream:#F4F2E4; --fr1:#26805F; --fr2:#D9775A; --frline:#BCDACB; --frdash:rgba(38,128,95,.55); }

  :root[data-theme="bosque"] { color-scheme: dark; --bg:#121A16; --paper:#1A2620; --ink:#E6F0E9; --muted:#93AA9C; --line:#2A3B32; --rose:#6FCF97; --rose-soft:#1F3A2C; --lav:#E8B36A; --lav-soft:#3A2F1B; --on-rose:#0E1F16; --warn:#F08A7E; --cream:#CBD3C4; --fr1:#2F7D57; --fr2:#B9782A; --frline:#AEBBA8; --frdash:rgba(47,125,87,.55); }
  :root[data-theme="oceano"] { color-scheme: dark; --bg:#0F1720; --paper:#17222E; --ink:#E4EEF7; --muted:#8FA5B8; --line:#24364A; --rose:#5CC0E8; --rose-soft:#143247; --lav:#F2A5B5; --lav-soft:#3A2530; --on-rose:#08202C; --warn:#F08A7E; --cream:#C3CFD6; --fr1:#1F7FA8; --fr2:#C8586F; --frline:#A9B9C4; --frdash:rgba(31,127,168,.55); }
  :root[data-theme="vino"] { color-scheme: dark; --bg:#1E1216; --paper:#291A22; --ink:#F5E6EB; --muted:#B08F9C; --line:#40262F; --rose:#E9B872; --rose-soft:#3A2A20; --lav:#E58AA0; --lav-soft:#40222C; --on-rose:#2A1A08; --warn:#F08A7E; --cream:#D5C3C7; --fr1:#A8641F; --fr2:#B23A5A; --frline:#BFA9AE; --frdash:rgba(168,100,31,.55); }

  select { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--ink); padding: 11px 14px; border-radius: 14px; font: inherit; font-size: 14px; }

            image: data.thumbnail_url || (id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : '')

        }
      } catch {}
      const id = youtubeIdFrom(url);
      if (id) return { title: '', description: '', image: `https://i.ytimg.com/vi/${id}/hqdefault.jpg` };
    }
    try {
      const res = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(url));

      if (data.status === 'success') {

          image: (data.data.image && data.data.image.url) || (data.data.logo && data.data.logo.url) || ''

  function fileToDataUrl(file, max = 420, q = .75) {
    return new Promise((res, rej) => {
      const img = new Image();
      const u = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k);
        cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(u);
        res(cv.toDataURL('image/jpeg', q));
      };
      img.onerror = rej;
      img.src = u;
    });
  }

    strokesRef.on('child_removed', onRem);
    const mine = presRef.child(CLIENT);
    const beat = () => mine.set({ who: currentWho, t: firebase.database.ServerValue.TIMESTAMP }).catch(() => {});
    beat();
    mine.onDisconnect().remove();
    presTimer = setInterval(beat, 10000);
    presCb = presRef.on('value', (s) => {
      const now = Date.now() + srvOff;
      const others = Object.entries(s.val() || {}).filter(([k, v]) => k !== CLIENT && v && now - v.t < 40000).map(([, v]) => v.who);
      $('padLive').textContent = others.length
        ? others.join(' y ') + (others.length > 1 ? ' están' : ' está') + ' dibujando con vos'
        : 'Esperando a que se sume la otra persona…';
    });
    syncWho();
  }
  function stopLive() {
    strokesRef.off('child_added', onAdd);
    strokesRef.off('child_changed', onChg);
    strokesRef.off('child_removed', onRem);
    if (presCb) presRef.off('value', presCb);
    clearInterval(presTimer);
    presRef.child(CLIENT).remove().catch(() => {});
  }
  padDlg.addEventListener('close', () => { if (padLive) { stopLive(); padLive = false; } });

  async function openPad(live) {
    padLive = live;
    padStrokes = [];
    padBase = null;
    cur = null;
    if (!live && bImg) { try { padBase = await loadImg(bImg); } catch {} }
    lctx.clearRect(0, 0, layer.width, layer.height);
    padPaint();
    $('padTitle').textContent = live ? 'Dibujar juntos' : 'Dibujar';
    $('padLive').hidden = !live;
    $('padWho').hidden = !live;
    $('pPhoto').hidden = live;
    $('pDone').textContent = live ? 'Guardar en el baúl' : 'Listo';
    $('pCancel').textContent = live ? 'Salir' : 'Cancelar';
    padDlg.showModal();
    if (live) startLive();
  }
  $('bDraw').addEventListener('click', () => openPad(false));
  $('bLive').addEventListener('click', () => openPad(true));
  $('padWho').addEventListener('click', (e) => {
    const b = e.target.closest('.pill');
    if (!b) return;
    currentWho = b.dataset.who;
    [...whoSelect.children].forEach(x => x.classList.toggle('active', x.dataset.who === currentWho));
    syncWho();
    if (padLive) presRef.child(CLIENT).update({ who: currentWho }).catch(() => {});
  });
  $('pUndo').addEventListener('click', () => {
    if (padLive) {
      const mine = [...padStrokes].reverse().find(s => s.cl === CLIENT);
      if (!mine) return;
      strokesRef.child(mine.id).remove().catch(() => {});
      padStrokes = padStrokes.filter(s => s !== mine);
    } else padStrokes.pop();
    padRepaint();
  });
  $('pClear').addEventListener('click', () => {
    if (padLive) {
      if (!confirm('¿Borrar el lienzo para los dos?')) return;
      strokesRef.remove().catch(() => {});
    }
    padStrokes = [];
    padBase = null;
    padRepaint();
  });
  $('pPhoto').addEventListener('click', () => $('pFile').click());
  $('pFile').addEventListener('change', async () => {
    const f = $('pFile').files[0];
    if (!f) return;
    try { padBase = await loadImg(await fileToDataUrl(f, 900)); padPaint(); } catch {}
    $('pFile').value = '';
  });
  $('pCancel').addEventListener('click', () => padDlg.close());
  $('pDone').addEventListener('click', async () => {
    padPaint();
    const img = pad.toDataURL('image/jpeg', .82);
    if (!padLive) { bImg = img; padDlg.close(); bSync(); return; }
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    try {
      await baulRef.child(id).set({ id, type: 'dibujo', who: 'Juntos', title: 'Dibujo hecho juntos', text: '', image: img, createdAt: Date.now() });
      $('padLive').textContent = 'Guardado en el baúl.';
    } catch { $('padLive').textContent = 'No se pudo guardar en el baúl.'; }
  });

  async function toggleSeen(id) {
    popId = id;
    items = items.map(i => i.id === id ? { ...i, seen: !i.seen } : i);
    render();
    const pb = document.querySelector('.item.seen .pop');
    if (pb) burst(pb);
    await persist();
  }

  async function setRating(id, n) {
    items = items.map(i => i.id === id ? { ...i, rating: n } : i);
    render();
    await persist();
  }

  async function removeItem(id) {
    items = items.filter(i => i.id !== id);
    render();
    await persist();
  }

  // Live sync: both Diego and Andro see updates instantly, no manual reload needed.
  itemsRef.on('value', (snapshot) => {
    const val = snapshot.val();
    items = val ? Object.values(val) : [];
    bannerEl.style.display = 'none';
    render();
  }, (err) => {
    bannerEl.style.display = 'block';
  });

  async function persist() {
    const obj = {};
    for (const item of items) obj[item.id] = item;
    try {
      await itemsRef.set(obj);
      statusEl.classList.remove('error');
      return true;
    } catch (err) {
      statusEl.textContent = 'No se pudo guardar. Revisá la conexión.';
      statusEl.classList.add('error');
      return false;
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = urlInput.value.trim();
    if (!url) return;

    submitBtn.disabled = true;
    statusEl.classList.remove('error');
    statusEl.textContent = 'Buscando vista previa...';

    const asText = currentCat === 'Juegos' && !looksLikeLink(url);
    const preview = asText ? { title: '', description: '', image: '' } : await fetchPreview(fixUrl(url));

    const newItem = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      url: asText ? url : fixUrl(url),
      isText: asText,
      coords: asText && COORD_RE.test(url),
      duration: asText ? 0 : Number(durInput.value) || 0,
      title: preview.title,
      description: preview.description,
      image: preview.image,
      note: noteInput.value.trim(),
      category: currentCat,
      addedBy: currentWho,
      addedAt: Date.now(),
      seen: false
    };
    items.push(newItem);
    render();
    urlInput.value = '';
    noteInput.value = '';
    durInput.value = '0';
    statusEl.textContent = 'Guardando...';
    const ok = await persist();
    if (ok) statusEl.textContent = '';
    submitBtn.disabled = false;
    urlInput.focus();
  });
</script>
</body>
</html>
