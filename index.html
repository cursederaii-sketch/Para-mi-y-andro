<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ver</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root {
    --bg:#FCF8F9; --paper:#fff; --ink:#3B2A35; --muted:#84707B; --line:#EBD9E0;
    --rose:#C94468; --rose-soft:#FBE7ED; --lav:#7A6BC4; --lav-soft:#ECE8F8;
    --on-rose:#fff; --warn:#B3443A; --cream:#FAF1E1; color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#1B141A; --paper:#251B22; --ink:#F5E9EF; --muted:#A88F9C; --line:#3A2A33;
      --rose:#EE7A9A; --rose-soft:#3B2330; --lav:#A99BEA; --lav-soft:#2D2743;
      --on-rose:#2A1520; --warn:#F08A7E; --cream:#EFE3D0;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 400 15px/1.5 Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2 { font-family: Fraunces, Georgia, serif; font-weight: 400; margin: 0; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; border-radius: 6px; }

  .wrap { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; padding: 48px 28px 84px; }
  .doodles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: .5; }
  .dd { position: absolute; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* Hero */
  .hero { text-align: center; padding: 8px 0 26px; }
  .art { width: min(240px, 70%); height: auto; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  .h1 { fill: var(--rose-soft); stroke: var(--rose); }
  .h2 { stroke: var(--lav); }
  .sp { stroke: var(--rose); }
  .sp2 { stroke: var(--lav); }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s .15s cubic-bezier(.5,0,.2,1) forwards; }
  .draw.d2 { animation-delay: .6s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  h1 { font-size: clamp(44px, 12vw, 64px); font-style: italic; font-weight: 300; letter-spacing: -.025em; line-height: 1; margin-top: -6px; }
  .sub { display: flex; align-items: center; justify-content: center; gap: 7px; color: var(--muted); margin: 12px 0 4px; font-size: 14.5px; }
  .sub .i { width: 15px; height: 15px; color: var(--rose); fill: var(--rose); stroke-width: 0; }
  .since { background: none; border: 0; color: var(--rose); font: italic 400 15.5px Fraunces, Georgia, serif; cursor: pointer; padding: 4px 10px; border-radius: 10px; }
  .since:hover { background: var(--rose-soft); }

  .banner { display: none; background: var(--rose-soft); border: 1px solid var(--rose); color: var(--warn); font-size: 13px; padding: 10px 14px; border-radius: 14px; margin-bottom: 20px; }

  /* Resumen */
  .sum { margin: 0 0 30px; text-align: center; }
  .sumtxt { font-size: 13.5px; color: var(--muted); }
  .track { position: relative; height: 2px; background: var(--line); margin: 14px 6px 20px; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--rose); width: calc(9px + (100% - 18px) * var(--p, 0)); transition: width .6s ease; }
  .mk { position: absolute; top: 50%; width: 18px; height: 17px; left: calc(9px + (100% - 18px) * var(--p, 0)); transform: translate(-50%, -50%); fill: var(--rose); stroke: var(--bg); stroke-width: 8; transition: left .6s ease; }
  .ghost { background: none; border: 1.5px solid var(--rose); color: var(--rose); border-radius: 999px; padding: 8px 18px; font: 600 13.5px Figtree, sans-serif; cursor: pointer; transition: background .15s; }
  .ghost:hover { background: var(--rose-soft); }
  .pick { margin: 12px 0 0; min-height: 24px; font: italic 17px Fraunces, Georgia, serif; }
  .pick small { display: block; font: 400 12.5px Figtree, sans-serif; color: var(--muted); }
  .pick a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rose); text-underline-offset: 4px; }

  /* Formulario */
  form { background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 34px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { background: none; border: 1px solid var(--line); color: var(--muted); padding: 6px 13px; border-radius: 999px; font: 500 13px Figtree, sans-serif; cursor: pointer; transition: .15s; }
  .pill:hover { color: var(--ink); }
  .pill.active { color: var(--ink); border-color: var(--rose); background: var(--rose-soft); }
  .pill[data-who="Diego"].active { border-color: var(--lav); background: var(--lav-soft); }
  input { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--ink); padding: 11px 14px; border-radius: 14px; font: inherit; font-size: 14px; }
  input:focus { outline: none; border-color: var(--rose); box-shadow: 0 0 0 3px var(--rose-soft); }
  input::placeholder { color: var(--muted); opacity: .85; }
  #sinceInput { width: auto; margin-top: 6px; text-align: center; }
  .btn { background: var(--rose); color: var(--on-rose); border: 0; border-radius: 999px; padding: 11px 18px; font: 600 14px Figtree, sans-serif; cursor: pointer; }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .5; cursor: default; }
  .status { font-size: 13px; color: var(--muted); min-height: 16px; }
  .status.error { color: var(--warn); }

  /* Filtros y listas */
  .tabs { display: flex; gap: 18px; justify-content: center; margin: 0 0 16px; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 4px 2px; color: var(--muted); font: 500 14px Figtree, sans-serif; cursor: pointer; }
  .tabs button.on { color: var(--ink); border-color: var(--rose); }
  .section { margin-bottom: 34px; }
  .sh { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; color: var(--rose); }
  .sh h2 { flex: 1; font-size: 23px; font-style: italic; color: var(--ink); }
  .ct { font-size: 12px; color: var(--rose); background: var(--rose-soft); border-radius: 999px; min-width: 24px; height: 24px; display: grid; place-items: center; padding: 0 7px; }

  .item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1.5px dashed var(--line); }
  .item:last-child { border-bottom: 0; }
  .item.seen .thumb, .item.seen .title, .item.seen .desc { opacity: .5; }
  .thumb { width: 72px; height: 72px; border-radius: 18px; background: var(--rose-soft); flex: none; object-fit: cover; display: block; }
  .thumb.ph { display: flex; align-items: center; justify-content: center; color: var(--rose); font-size: 11px; text-align: center; padding: 4px; word-break: break-all; }
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .title { font-weight: 600; font-size: 14.5px; line-height: 1.3; margin: 0 0 3px; }
  .item.seen .title { text-decoration: line-through; }
  a.tl { color: var(--ink); text-decoration: none; }
  a.tl:hover { color: var(--rose); }
  .desc { font-size: 12.5px; color: var(--muted); margin: 0 0 5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .note { font: italic 14px Fraunces, Georgia, serif; color: var(--rose); margin: 0 0 5px; }
  .meta { display: flex; gap: 10px; align-items: center; margin-top: auto; font-size: 11.5px; color: var(--muted); }
  .who { display: inline-flex; align-items: center; gap: 5px; }
  .who::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--rose); }
  .who.Diego::before { background: var(--lav); }
  .actions { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; flex: none; }
  .check { background: none; border: 0; padding: 2px; cursor: pointer; color: var(--muted); line-height: 0; }
  .check svg { width: 26px; height: 24px; fill: none; stroke: currentColor; stroke-width: 5; stroke-linejoin: round; }
  .check:hover { color: var(--rose); }
  .item.seen .check { color: var(--rose); }
  .item.seen .check svg { fill: var(--rose); }
  .item.seen .pop svg { animation: pop .4s; }
  @keyframes pop { 40% { transform: scale(1.35); } }
  .del { background: none; border: 0; color: var(--muted); font: 12px Figtree, sans-serif; cursor: pointer; padding: 2px; }
  .del:hover { color: var(--rose); text-decoration: underline; }
  .empty { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13.5px; padding: 14px 0; }
  .empty svg { width: 30px; height: 28px; flex: none; color: var(--rose); fill: none; stroke: currentColor; stroke-width: 4; stroke-dasharray: 6 7; stroke-linecap: round; }

  .foot { text-align: center; margin-top: 20px; color: var(--muted); font: italic 15px Fraunces, Georgia, serif; }
  .foot svg { display: block; margin: 0 auto 8px; width: 110px; height: 54px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  .frame { position: fixed; inset: 10px; z-index: 5; pointer-events: none; border-radius: 26px; border: 1.5px solid #D9B8C0; box-shadow: 0 0 0 60px var(--cream); }
  .frame::after { content: ""; position: absolute; inset: 5px; border: 1px dashed rgba(201,68,104,.55); border-radius: 21px; }
  .fc { position: absolute; width: 26px; height: 24px; fill: var(--cream); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  @media (min-width: 640px) { .frame { inset: 18px; } }
  .count { margin: 2px 0 0; font: italic 14px Fraunces, Georgia, serif; color: var(--muted); }
  .rate { display: flex; gap: 2px; margin: 0 0 5px; }
  .rate button { background: none; border: 0; padding: 1px; line-height: 0; cursor: pointer; color: var(--muted); }
  .rate svg { width: 15px; height: 14px; fill: none; stroke: currentColor; stroke-width: 6; stroke-linejoin: round; }
  .rate .on { color: var(--rose); }
  .rate .on svg { fill: currentColor; }
  .srv { color: var(--muted); }
  .srv.up { color: #2F8A55; }
  @media (prefers-color-scheme: dark) { .srv.up { color: #6CCB93; } }
  select { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--ink); padding: 11px 14px; border-radius: 14px; font: inherit; font-size: 14px; }
  select:focus { outline: none; border-color: var(--rose); box-shadow: 0 0 0 3px var(--rose-soft); }
  .tools { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin: 0 0 24px; }
  .dur { color: var(--muted); }
  .sub2 { margin: 14px 0 0; font: italic 15px Fraunces, Georgia, serif; color: var(--rose); }
  .conv { margin: 0 0 5px; font-size: 12px; color: var(--muted); }
  .mini { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .list.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 16px 14px; padding-top: 10px; }
  .gal .item { flex-direction: column; gap: 8px; padding: 0; border: 0; }
  .gal .thumb { width: 100%; height: auto; aspect-ratio: 4 / 5; }
  .gal .desc { display: none; }
  .gal .actions { flex-direction: row; align-items: center; justify-content: space-between; }
  .gal .mini { flex-direction: row; gap: 10px; }
  .ph.clk { cursor: pointer; }
  dialog { border: 0; border-radius: 24px; padding: 20px; background: var(--paper); color: var(--ink); width: min(420px, calc(100% - 32px)); box-shadow: 0 20px 60px rgba(40,20,30,.3); }
  dialog::backdrop { background: rgba(40,20,30,.45); }
  dialog h2 { font-size: 24px; font-style: italic; margin-bottom: 4px; }
  .lbl { display: block; margin: 12px 0 5px; font-size: 12.5px; color: var(--muted); }
  .editprev { display: block; width: 100%; max-height: 260px; object-fit: contain; background: var(--bg); border-radius: 16px; margin-top: 8px; cursor: zoom-in; }
  .row2 { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .row2.l { justify-content: flex-start; margin-top: 8px; }
  textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--ink); padding: 11px 14px; border-radius: 14px; font: inherit; font-size: 14px; resize: vertical; }
  textarea:focus { outline: none; border-color: var(--rose); box-shadow: 0 0 0 3px var(--rose-soft); }
  textarea::placeholder { color: var(--muted); opacity: .85; }
  .baulbtn { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; background: var(--lav-soft); color: var(--lav); border: 0; border-radius: 999px; padding: 9px 18px; font: 600 13.5px Figtree, sans-serif; cursor: pointer; transition: filter .15s; }
  .baulbtn:hover { filter: brightness(.96); }
  #baulDlg { width: min(720px, calc(100% - 20px)); height: min(94vh, 940px); padding: 0; overflow: hidden; border: 1.5px solid var(--line); }
  #baulDlg[open] { display: flex; flex-direction: column; }
  .bhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 20px 20px 12px; border-bottom: 1.5px dashed var(--line); }
  .bhead h2 { display: flex; align-items: center; gap: 10px; font-size: 28px; font-style: italic; }
  .bsub { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
  .bscroll { flex: 1; overflow: auto; padding: 16px 20px 26px; }
  .bcomp { display: flex; flex-direction: column; gap: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin: 14px 0 18px; }
  .bgrid { column-count: 2; column-gap: 12px; margin-top: 6px; }
  @media (max-width: 380px) { .bgrid { column-count: 1; } }
  .bcard { break-inside: avoid; margin: 0 0 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; cursor: pointer; }
  .bcard img { display: block; width: 100%; }
  .bcard.tx { background: var(--rose-soft); border-color: transparent; }
  .bbody2 { padding: 12px 14px; }
  .bcard h3 { font: italic 400 18px/1.25 Fraunces, Georgia, serif; margin: 0 0 4px; overflow-wrap: anywhere; }
  .btext { margin: 0; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .bcard.tx .btext { font: italic 16px/1.5 Fraunces, Georgia, serif; -webkit-line-clamp: 7; }
  .bcard.open .btext { display: block; }
  .bmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  .bmeta .del { margin-left: auto; }
  #pad { display: block; width: 100%; aspect-ratio: 1; border-radius: 16px; border: 1px solid var(--line); background: #FFFDF8; touch-action: none; cursor: crosshair; margin-top: 10px; }
  .pal { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 4px; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); padding: 0; cursor: pointer; }
  .sw.on { outline: 2px solid var(--rose); outline-offset: 2px; }
  #pSz { padding: 0; border: 0; background: none; accent-color: var(--rose); }
  .zoom { cursor: zoom-in; }
  #imgDlg { width: min(96vw, 900px); max-width: none; padding: 12px; text-align: center; }
  #imgDlg img { display: block; max-width: 100%; max-height: 78vh; margin: 0 auto; object-fit: contain; border-radius: 14px; }
  #imgDlg p { margin: 10px 0 2px; font: italic 15px Fraunces, Georgia, serif; }
  #imgDlg p:empty { display: none; }
  #imgDlg .ghost { margin-top: 10px; }
  .hint { margin: 0 0 4px; font-size: 12.5px; color: var(--muted); }
  .i.big { width: 30px; height: 30px; }
  .ip { font: 500 13.5px ui-monospace, Menlo, Consolas, monospace; background: var(--rose-soft); padding: 3px 9px; border-radius: 8px; word-break: break-all; user-select: all; }
  .del.cp { color: var(--rose); font-weight: 600; }
  .fly { position: fixed; z-index: 9; width: 12px; height: 11px; pointer-events: none; color: var(--rose); animation: fly 1s var(--d) ease-out forwards; }
  .fly svg { width: 100%; height: 100%; fill: currentColor; }
  @keyframes fly { from { opacity: 1; transform: translate(-50%,-50%) scale(.6); } to { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); } }
  @media (prefers-reduced-motion: reduce) {
    .fly { display: none; }
    * { animation: none !important; transition: none !important; }
    .draw { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <path id="heart" d="M50 86C22 64 6 47 6 29 6 16 16 7 28 7c9 0 17 5 22 14 5-9 13-14 22-14 12 0 22 9 22 22 0 18-16 35-44 57z"/>
  <path id="spark" d="M0-9C1-4 4-1 9 0 4 1 1 4 0 9-1 4-4 1-9 0-4-1-1-4 0-9z"/>
  <path id="i-Anime" d="M12 3c.8 5 3 7.2 8 8-5 .8-7.2 3-8 8-.8-5-3-7.2-8-8 5-.8 7.2-3 8-8z"/>
  <path id="i-YouTube" d="M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM10 9.5v5l4.5-2.5z"/>
  <path id="i-Peliculas" d="M4 5h16v14H4zM8 5v14M16 5v14M4 10h4M4 14h4M16 10h4M16 14h4"/>
  <path id="i-Series" d="M3 7h18v12H3zM8 3l4 4 4-4"/>
  <path id="i-Juegos" d="M6 9h12a3 3 0 0 1 3 3.5l-.7 3.6a2 2 0 0 1-3.4.9L15 15H9l-1.9 2a2 2 0 0 1-3.4-.9L3 12.5A3 3 0 0 1 6 9zM8 11v3M6.5 12.5h3M16 12h.01M18 13.5h.01"/>
  <path id="i-box" d="M4 11a8 6 0 0 1 16 0M3 11h18v9H3zM12 14v3"/>
  <path id="cube" d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/>
</defs></svg>

<div class="doodles" aria-hidden="true">
  <svg class="dd" viewBox="0 0 100 92" style="top:9%;left:-14px;width:64px;color:var(--rose);transform:rotate(-16deg)"><use href="#heart"/></svg>
  <svg class="dd" viewBox="-10 -10 20 20" style="top:6%;right:7%;width:26px;color:var(--lav)"><use href="#spark"/></svg>
  <svg class="dd" viewBox="0 0 100 92" style="top:38%;right:-10px;width:46px;color:var(--lav);transform:rotate(14deg)"><use href="#heart"/></svg>
  <svg class="dd" viewBox="-10 -10 20 20" style="top:52%;left:3%;width:22px;color:var(--rose)"><use href="#spark"/></svg>
  <svg class="dd" viewBox="0 0 100 92" style="bottom:8%;right:5%;width:54px;color:var(--rose);transform:rotate(10deg)"><use href="#heart"/></svg>
  <svg class="dd" viewBox="-10 -10 20 20" style="bottom:14%;left:8%;width:30px;color:var(--lav)"><use href="#spark"/></svg>
</div>

<div class="frame" aria-hidden="true">
  <svg class="fc" viewBox="0 0 100 92" style="top:-16px;left:-14px;stroke:#C94468;transform:rotate(-18deg)"><use href="#heart"/></svg>
  <svg class="fc" viewBox="-10 -10 20 20" style="top:-14px;right:-13px;width:24px;height:24px;stroke:#7A6BC4;stroke-width:1.5"><use href="#spark"/></svg>
  <svg class="fc" viewBox="-10 -10 20 20" style="bottom:-14px;left:-13px;width:24px;height:24px;stroke:#7A6BC4;stroke-width:1.5"><use href="#spark"/></svg>
  <svg class="fc" viewBox="0 0 100 92" style="bottom:-16px;right:-14px;stroke:#C94468;transform:rotate(16deg)"><use href="#heart"/></svg>
</div>

<div class="wrap">
  <header class="hero">
    <svg class="art" viewBox="0 0 240 120" aria-hidden="true">
      <path class="draw h1" pathLength="1" transform="translate(58 14) scale(.98)" d="M50 86C22 64 6 47 6 29 6 16 16 7 28 7c9 0 17 5 22 14 5-9 13-14 22-14 12 0 22 9 22 22 0 18-16 35-44 57z"/>
      <path class="draw d2 h2" pathLength="1" transform="translate(112 30) rotate(12 47 43) scale(.8)" d="M50 86C22 64 6 47 6 29 6 16 16 7 28 7c9 0 17 5 22 14 5-9 13-14 22-14 12 0 22 9 22 22 0 18-16 35-44 57z"/>
      <g class="sp"><use href="#spark" transform="translate(34 30) scale(.85)"/></g>
      <g class="sp2"><use href="#spark" transform="translate(206 22) scale(.65)"/><use href="#spark" transform="translate(30 92) scale(.5)"/></g>
      <g class="sp"><use href="#spark" transform="translate(200 98) scale(.75)"/></g>
    </svg>
    <h1>Para ver</h1>
    <p class="sub">Lista compartida de Diego <svg class="i" viewBox="0 0 100 92" aria-hidden="true"><use href="#heart"/></svg> Andro</p>
    <button type="button" class="since" id="sinceBtn"></button>
    <input type="date" id="sinceInput" aria-label="Fecha en que empezaron" hidden>
    <p class="count" id="countTxt"></p>
    <button type="button" class="baulbtn" id="baulBtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-box"/></svg>Nuestro baúl</button>

<script>
  // --- Firebase setup ---
  const firebaseConfig = {
    apiKey: "AIzaSyDMVbDCxFJo5_J0wMoiNb4AVrZCiV4GFGc",
    authDomain: "para-ver-ce1b9.firebaseapp.com",
    databaseURL: "https://para-ver-ce1b9-default-rtdb.firebaseio.com",
    projectId: "para-ver-ce1b9",
    storageBucket: "para-ver-ce1b9.firebasestorage.app",
    messagingSenderId: "101656425888",
    appId: "1:101656425888:web:1fd31b060bbf21f6a3a0c5",
    measurementId: "G-3GJDE3H6L8"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const itemsRef = db.ref('paraVer/items');

  const $ = id => document.getElementById(id);
  const CATEGORIES = ['Anime', 'YouTube', 'Peliculas', 'Series', 'Juegos'];
  const CAT_LABELS = { Anime: 'Anime', YouTube: 'YouTube', Peliculas: 'Películas', Series: 'Series', Juegos: 'Juegos' };
  let items = [];
  let currentWho = 'Diego';
  let currentCat = 'Anime';
  let currentFilter = 'all';
  let popId = null;
  let maxMin = 0;
  let view = 'list';
  try { view = localStorage.getItem('view') || 'list'; } catch {}

  const sectionsEl = $('sections');
  const statusEl = $('status');
  const bannerEl = $('storageBanner');
  const form = $('form');
  const urlInput = $('url');
  const noteInput = $('noteInput');
  const whoSelect = $('whoSelect');
  const catSelect = $('catSelect');
  const submitBtn = $('submitBtn');
  const looksLikeLink = s => /^(https?:\/\/|www\.)|roblox\.com/i.test(s);
  const fixUrl = s => /^https?:\/\//i.test(s) ? s : 'https://' + s;
  catSelect.addEventListener('click', (e) => {
    const b = e.target.closest('.pill');
    if (!b) return;
    urlInput.placeholder = b.dataset.cat === 'Juegos' ? 'Link de Roblox, IP del server o coordenadas' : 'Pegá el enlace acá';
    durInput.hidden = b.dataset.cat === 'Juegos';
  });

  // --- Días juntos (se guarda en la base y, de respaldo, en el navegador) ---
  const sinceRef = db.ref('paraVer/since');
  const sinceBtn = $('sinceBtn');
  const sinceInput = $('sinceInput');
  let since = null;
  try { since = localStorage.getItem('since'); } catch {}

  function renderSince() {
    const d = since ? Math.floor((Date.now() - new Date(since + 'T00:00:00')) / 864e5) : NaN;
    sinceBtn.textContent = d > 0 ? `Juntos hace ${d} ${d === 1 ? 'día' : 'días'}`
      : d === 0 ? 'Juntos desde hoy' : 'Poné la fecha en que empezaron';
    sinceBtn.hidden = false;
    sinceInput.hidden = true;
    renderCount(d);
  }
  function renderCount(d) {
    const out = $('countTxt');
    if (!(d >= 0)) { out.textContent = ''; return; }
    const [y, m, dd] = since.split('-').map(Number);
    const at = n => { const t = new Date(y, m - 1 + n, dd); return t.getDate() === dd ? t : new Date(y, m + n, 0); };
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let n = 1;
    while (at(n) < today) n++;
    const left = Math.round((at(n) - today) / 864e5);
    const ann = n % 12 === 0;
    if (left === 0) {
      out.textContent = ann ? `¡Hoy es su aniversario número ${n / 12}!` : n === 1 ? '¡Hoy cumplen su primer mes!' : `¡Hoy cumplen ${n} meses!`;
      return;
    }
    const what = ann ? `su aniversario número ${n / 12}` : n === 1 ? 'su primer mes juntos' : `sus ${n} meses`;
    out.textContent = `${left === 1 ? 'Falta 1 día' : 'Faltan ' + left + ' días'} para ${what}`;
  }
  sinceBtn.addEventListener('click', () => {
    sinceBtn.hidden = true;
    sinceInput.hidden = false;
    sinceInput.value = since || '';
    sinceInput.focus();
  });
  sinceInput.addEventListener('change', () => {
    since = sinceInput.value;
    try { localStorage.setItem('since', since); } catch {}
    sinceRef.set(since).catch(() => {});
    renderSince();
  });
  sinceInput.addEventListener('blur', renderSince);
  sinceRef.on('value', (s) => {
    const v = s.val();
    if (v) { since = v; try { localStorage.setItem('since', v); } catch {} }
    renderSince();
  }, renderSince);

  // --- Duración, vista y tiempo disponible ---
  const COORD_RE = /^\s*-?\d+([\s,]+-?\d+){1,2}\s*$/;
  const DURS = [10, 15, 20, 25, 30, 45, 60, 90, 120, 150, 180, 240];
  const fmtDur = m => m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) : '');
  function fillDur(sel, first) {
    sel.innerHTML = '';
    for (const m of [0, ...DURS]) {
      const o = document.createElement('option');
      o.value = m;
      o.textContent = m ? fmtDur(m) : first;
      sel.appendChild(o);
    }
  }
  const durInput = $('durInput');
  fillDur(durInput, 'Duración (opcional)');
  fillDur($('eDur'), 'Sin duración');
  function syncView() { [...$('viewSel').children].forEach(x => x.classList.toggle('active', x.dataset.v === view)); }
  syncView();
  $('timeSel').addEventListener('click', (e) => {
    const b = e.target.closest('.pill');
    if (!b) return;
    maxMin = Number(b.dataset.m);
    [...$('timeSel').children].forEach(x => x.classList.toggle('active', x === b));
    render();
  });
  $('viewSel').addEventListener('click', (e) => {
    const b = e.target.closest('.pill');
    if (!b) return;
    view = b.dataset.v;
    try { localStorage.setItem('view', view); } catch {}
    syncView();
    render();
  });

  // --- Filtros ---
  $('filters').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    currentFilter = b.dataset.f;
    [...$('filters').children].forEach(x => x.classList.toggle('on', x === b));
    render();
  });

  // --- Elegir algo para hoy ---
  $('pickBtn').addEventListener('click', () => {
    const pool = items.filter(i => !i.seen && !i.isText && (!maxMin || (i.duration && i.duration <= maxMin)));
    const out = $('pick');
    out.textContent = '';
    if (!pool.length) {
      out.textContent = items.length ? 'Ya vieron todo. Sumen algo nuevo.' : 'Todavía no hay nada guardado.';
      return;
    }
    const p = pool[Math.floor(Math.random() * pool.length)];
    const small = document.createElement('small');
    small.textContent = 'Hoy podrían ver (' + (CAT_LABELS[p.category] || p.category) + ')';
    const a = document.createElement('a');
    a.href = p.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = p.title || domainOf(p.url);
    out.append(small, a);
  });

  whoSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('.pill');
    if (!btn) return;
    currentWho = btn.dataset.who;
    [...whoSelect.children].forEach(b => b.classList.toggle('active', b === btn));
  });
  catSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('.pill');
    if (!btn) return;
    currentCat = btn.dataset.cat;
    [...catSelect.children].forEach(b => b.classList.toggle('active', b === btn));
  });

  function domainOf(url) {
    try { return new URL(url).hostname.replace('www.', ''); }
    catch { return url; }
  }

  function youtubeIdFrom(url) {
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  async function fetchPreview(url) {
    if (/youtu\.?be/.test(url)) {
      try {
        const res = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(url));
        if (res.ok) {
          const data = await res.json();
          const id = youtubeIdFrom(url);
          return {
            title: data.title || '',
            description: data.author_name ? 'YouTube · ' + data.author_name : '',
            image: data.thumbnail_url || (id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : '')
          };
        }
      } catch {}
      const id = youtubeIdFrom(url);
      if (id) return { title: '', description: '', image: `https://i.ytimg.com/vi/${id}/hqdefault.jpg` };
    }
    try {
      const res = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(url));
      const data = await res.json();
      if (data.status === 'success') {
        return {
          title: data.data.title || '',
          description: data.data.description || '',
          image: (data.data.image && data.data.image.url) || (data.data.logo && data.data.logo.url) || ''
        };
      }
    } catch {}
    return { title: '', description: '', image: '' };
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  const HEART = '<svg viewBox="0 0 100 92" aria-hidden="true"><use href="#heart"/></svg>';
  function burst(btn) {
    const r = btn.getBoundingClientRect();
    for (let i = 0; i < 6; i++) {
      const h = document.createElement('span');
      h.className = 'fly';
      h.innerHTML = HEART;
      h.style.cssText = `left:${r.left + r.width / 2}px;top:${r.top + r.height / 2}px;--dx:${(Math.random() - .5) * 70}px;--dy:${-40 - Math.random() * 40}px;--d:${Math.random() * .15}s`;
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1200);
    }
  }

  const srvCache = {};
  function srvStatus(host, node) {
    const show = d => {
      const up = !!(d && d.online);
      node.textContent = up ? '● en línea' + (d.players ? ' · ' + d.players.online + '/' + d.players.max : '') : '○ sin respuesta';
      node.classList.toggle('up', up);
    };
    if (!(host in srvCache)) srvCache[host] = fetch('https://api.mcsrvstat.us/3/' + encodeURIComponent(host)).then(r => r.json()).catch(() => null);
    srvCache[host].then(show);
  }

  function emptyEl(msg) {
    const e = el('div', 'empty');
    e.innerHTML = HEART;
    e.append(el('span', null, msg));
    return e;
  }

  function row(item) {
    const r = el('div', 'item' + (item.seen ? ' seen' : ''));
    let thumb;
    if (item.isText) {
      thumb = el('div', 'thumb ph');
      thumb.innerHTML = '<svg class="i big" viewBox="0 0 24 24" aria-hidden="true"><use href="#cube"/></svg>';
    } else if (item.image) {
      thumb = el('img', 'thumb');
      thumb.src = item.image;
      thumb.alt = '';
      thumb.classList.add('zoom');
      thumb.onclick = () => showImg(item.image, item.title || domainOf(item.url));
      thumb.loading = 'lazy';
      thumb.onerror = () => {
        const ph = el('div', 'thumb ph clk', domainOf(item.url));
        ph.title = 'Agregar banner';
        ph.onclick = () => openEdit(item);
        thumb.replaceWith(ph);
      };
    } else {
      thumb = el('div', 'thumb ph clk', domainOf(item.url));
      thumb.title = 'Agregar banner';
      thumb.onclick = () => openEdit(item);
    }

    const c = el('div', 'content');
    const t = el('p', 'title');
    const a = el('a', 'tl', item.title || domainOf(item.url));
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    if (item.isText) t.appendChild(el('code', 'ip', item.url)); else t.appendChild(a);
    c.appendChild(t);
    if (item.coords) {
      const nums = item.url.trim().split(/[\s,]+/).map(Number);
      const nether = /nether/i.test(item.note || '');
      const conv = nums.map((n, i) => (nums.length === 3 && i === 1) ? n : (nether ? n * 8 : Math.floor(n / 8)));
      c.appendChild(el('p', 'conv', (nether ? 'En el Overworld: ' : 'En el Nether: ') + conv.join(' ')));
    }
    if (item.description) c.appendChild(el('p', 'desc', item.description));
    if (item.note) c.appendChild(el('p', 'note', item.note));
    if (item.seen && !item.isText) {
      const rt = el('div', 'rate');
      for (let n = 1; n <= 5; n++) {
        const b = el('button', n <= (item.rating || 0) ? 'on' : '');
        b.type = 'button';
        b.setAttribute('aria-label', n + ' de 5 corazones');
        b.innerHTML = HEART;
        b.onclick = () => setRating(item.id, n === item.rating ? 0 : n);
        rt.appendChild(b);
      }
      c.appendChild(rt);
    }
    const m = el('div', 'meta');
    m.append(
      el('span', 'who ' + item.addedBy, item.addedBy),
      el('span', null, new Date(item.addedAt).toLocaleDateString('es', { day: 'numeric', month: 'short' }))
    );
    if (item.duration) m.appendChild(el('span', 'dur', fmtDur(item.duration)));
    if (item.isText && !item.coords) {
      const st = el('span', 'srv', 'revisando…');
      m.appendChild(st);
      srvStatus(item.url, st);
    }
    c.appendChild(m);

    const act = el('div', 'actions');
    const chk = el('button', 'check' + (item.id === popId ? ' pop' : ''));
    chk.type = 'button';
    chk.setAttribute('aria-pressed', String(!!item.seen));
    chk.setAttribute('aria-label', item.seen ? 'Marcar como no visto' : 'Marcar como visto');
    chk.innerHTML = HEART;
    chk.onclick = () => toggleSeen(item.id);
    const del = el('button', 'del', 'Eliminar');
    del.type = 'button';
    del.onclick = () => { if (confirm('¿Eliminar este ítem?')) removeItem(item.id); };
    const ed = el('button', 'del', 'Editar');
    ed.type = 'button';
    ed.onclick = () => openEdit(item);
    const mini = el('div', 'mini');
    mini.append(ed, del);
    if (item.isText) {
      const cp = el('button', 'del cp', 'Copiar');
      cp.type = 'button';
      cp.onclick = () => {
        navigator.clipboard.writeText(item.url).then(() => {
          cp.textContent = '¡Copiado!';
          setTimeout(() => { cp.textContent = 'Copiar'; }, 1500);
        }).catch(() => {});
      };
      act.append(cp, mini);
    } else act.append(chk, mini);

    r.append(thumb, c, act);
    return r;
  }

  function render() {
    const counted = items.filter(i => !i.isText);
    const total = counted.length;
    const seen = counted.filter(i => i.seen).length;
    $('sumTxt').textContent = total ? `${seen} de ${total} vistas` : 'Empiecen sumando algo para ver juntos';
    $('track').style.setProperty('--p', total ? seen / total : 0);

    sectionsEl.innerHTML = '';
    for (const cat of CATEGORIES) {
      let list = items.filter(i => i.category === cat).sort((a, b) => b.addedAt - a.addedAt);
      if (currentFilter === 'todo') list = list.filter(i => !i.seen);
      if (currentFilter === 'seen') list = list.filter(i => i.seen);
      if (maxMin) list = list.filter(i => i.duration && i.duration <= maxMin);
      if (!list.length && (currentFilter !== 'all' || maxMin)) continue;

      const section = el('div', 'section');
      const head = el('div', 'sh');
      head.innerHTML = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${cat}"/></svg>`;
      head.append(el('h2', null, CAT_LABELS[cat]), el('span', 'ct', list.length));
      section.appendChild(head);
      if (cat === 'Juegos') section.appendChild(el('p', 'hint', 'Links de Roblox, IP de servers y coordenadas de Minecraft (ej: 120 64 -300).'));
      if (!list.length) section.appendChild(emptyEl('Nada guardado todavía. Pegá un enlace arriba para sumar el primero.'));
      const addBox = arr => {
        if (!arr.length) return;
        const box = el('div', 'list' + (view === 'gal' ? ' gal' : ''));
        arr.forEach(i => box.appendChild(row(i)));
        section.appendChild(box);
      };
      if (cat === 'Juegos') {
        addBox(list.filter(i => !i.isText));
        const srv = list.filter(i => i.isText && !i.coords);
        const cd = list.filter(i => i.coords);
        if (srv.length) { section.appendChild(el('p', 'sub2', 'Servers')); addBox(srv); }
        if (cd.length) { section.appendChild(el('p', 'sub2', 'Cuaderno de Minecraft')); addBox(cd); }
      } else addBox(list);
      sectionsEl.appendChild(section);
    }
    if (!sectionsEl.children.length) {
      sectionsEl.appendChild(emptyEl(maxMin ? 'Nada de lo guardado entra en ese tiempo.' : currentFilter === 'seen'
        ? 'Todavía no marcaron nada como visto.'
        : 'No queda nada por ver. ¡Sumen algo nuevo!'));
    }
    popId = null;
  }

  const dlg = $('editDlg');
  let editing = null;
  let editImg = '';

  function fileToDataUrl(file, max = 420) {
    return new Promise((res, rej) => {
      const img = new Image();
      const u = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k);
        cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(u);
        res(cv.toDataURL('image/jpeg', .75));
      };
      img.onerror = rej;
      img.src = u;
    });
  }
  function syncPrev() {
    $('ePrev').hidden = !editImg;
    if (editImg) $('ePrev').src = editImg;
    $('eImg').placeholder = editImg.startsWith('data:') ? 'Foto subida desde tu dispositivo' : 'https://…';
  }
  function openEdit(item) {
    editing = item;
    editImg = item.image || '';
    $('eText').hidden = !item.isText;
    $('eLink').hidden = !!item.isText;
    $('eTextIn').value = item.isText ? item.url : '';
    $('eTitle').value = item.title || '';
    $('eDur').value = String(item.duration || 0);
    $('eImg').value = editImg.startsWith('data:') ? '' : editImg;
    $('eNote').value = item.note || '';
    syncPrev();
    dlg.showModal();
  }
  $('eImg').addEventListener('input', () => { editImg = $('eImg').value.trim(); syncPrev(); });
  $('eClear').addEventListener('click', () => { editImg = ''; $('eImg').value = ''; syncPrev(); });
  $('eUpload').addEventListener('click', () => $('eFile').click());
  $('eFile').addEventListener('change', async () => {
    const f = $('eFile').files[0];
    if (!f) return;
    try { editImg = await fileToDataUrl(f); $('eImg').value = ''; syncPrev(); } catch {}
    $('eFile').value = '';
  });
  $('eCancel').addEventListener('click', () => dlg.close());
  $('eSave').addEventListener('click', async () => {
    const id = editing.id;
    const patch = { note: $('eNote').value.trim() };
    if (editing.isText) {
      const t = $('eTextIn').value.trim();
      if (!t) return;
      patch.url = t;
      patch.coords = COORD_RE.test(t);
    } else {
      patch.title = $('eTitle').value.trim();
      patch.duration = Number($('eDur').value) || 0;
      patch.image = editImg;
    }
    items = items.map(i => i.id === id ? { ...i, ...patch } : i);
    dlg.close();
    render();
    await persist();
  });

  // --- Imagen en grande ---
  const imgDlg = $('imgDlg');
  function showImg(src, cap) {
    if (!src) return;
    $('lbImg').src = src;
    $('lbImg').alt = cap || '';
    $('lbCap').textContent = cap || '';
    imgDlg.showModal();
  }
  imgDlg.addEventListener('click', () => imgDlg.close());
  $('lbClose').addEventListener('click', () => imgDlg.close());
  $('ePrev').addEventListener('click', () => showImg($('ePrev').src, ''));
  $('bPrev').addEventListener('click', () => showImg($('bPrev').src, ''));

  // --- Nuestro baúl ---
  const baulRef = db.ref('paraVer/baul');
  const baulDlg = $('baulDlg');
  const padDlg = $('padDlg');
  const BLABEL = { dibujo: 'Dibujo', texto: 'Texto', cosa: 'Cosa nuestra' };
  const BHINT = {
    dibujo: ['Nombre del dibujo (opcional)', 'Algo para acompañarlo (opcional)'],
    texto: ['Título (opcional)', 'Escribí acá tu carta, poema o lo que quieras…'],
    cosa: ['Qué es (ej: pulsera, playlist, video)', 'Contá cómo fue o para qué es']
  };
  let baul = [], baulOn = false, bFilter = 'all', bType = 'dibujo', bWho = 'Diego', bImg = '';

  function bSync() {
    [...$('bType').children].forEach(x => x.classList.toggle('active', x.dataset.t === bType));
    [...$('bWho').children].forEach(x => x.classList.toggle('active', x.dataset.who === bWho));
    $('bTitle').placeholder = BHINT[bType][0];
    $('bText').placeholder = BHINT[bType][1];
    $('bPrev').hidden = !bImg;
    if (bImg) $('bPrev').src = bImg;
    $('bRm').hidden = !bImg;
  }
  function bReset() {
    $('bTitle').value = '';
    $('bText').value = '';
    $('bStatus').textContent = '';
    bImg = '';
    bSync();
  }
  function bCard(e) {
    const c = el('article', 'bcard ' + (e.image ? 'im' : 'tx'));
    if (e.image) {
      const im = el('img');
      im.src = e.image;
      im.alt = e.title || 'Dibujo';
      im.loading = 'lazy';
      im.classList.add('zoom');
      im.onclick = (ev) => { ev.stopPropagation(); showImg(e.image, e.title || ''); };
      c.appendChild(im);
    }
    const b = el('div', 'bbody2');
    if (e.title) b.appendChild(el('h3', null, e.title));
    if (e.text) b.appendChild(el('p', 'btext', e.text));
    const m = el('div', 'bmeta');
    const del = el('button', 'del', 'Eliminar');
    del.type = 'button';
    del.onclick = (ev) => { ev.stopPropagation(); if (confirm('¿Eliminar esto del baúl?')) baulRef.child(e.id).remove(); };
    m.append(
      el('span', 'who ' + e.who, e.who),
      el('span', null, BLABEL[e.type] || ''),
      el('span', null, new Date(e.createdAt).toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' })),
      del
    );
    b.appendChild(m);
    c.appendChild(b);
    c.onclick = () => c.classList.toggle('open');
    return c;
  }
  function renderBaul() {
    const g = $('bGrid');
    g.innerHTML = '';
    const list = baul.filter(e => bFilter === 'all' || e.type === bFilter).sort((a, b) => b.createdAt - a.createdAt);
    if (!list.length) {
      g.appendChild(emptyEl(baul.length ? 'No hay nada de este tipo todavía.' : 'Todavía no guardaron nada. Un dibujo, una carta o algo que se hicieron: sean los primeros.'));
      return;
    }
    list.forEach(e => g.appendChild(bCard(e)));
  }
  function openBaul() {
    bWho = currentWho;
    bSync();
    document.body.style.overflow = 'hidden';
    baulDlg.showModal();
    if (baulOn) { renderBaul(); return; }
    baulOn = true;
    baulRef.on('value', (s) => { baul = Object.values(s.val() || {}); renderBaul(); }, () => {
      $('bGrid').innerHTML = '';
      $('bGrid').appendChild(emptyEl('No se pudo leer el baúl. Puede que las reglas de Firebase no permitan leer paraVer/baul.'));
    });
  }
  $('baulBtn').addEventListener('click', openBaul);
  $('bClose').addEventListener('click', () => baulDlg.close());
  baulDlg.addEventListener('close', () => { document.body.style.overflow = ''; });
  baulDlg.addEventListener('click', (e) => { if (e.target === baulDlg) baulDlg.close(); });
  $('bAdd').addEventListener('click', () => { $('bComp').hidden = !$('bComp').hidden; bSync(); });
  $('bCancel').addEventListener('click', () => { bReset(); $('bComp').hidden = true; });
  $('bType').addEventListener('click', (e) => { const b = e.target.closest('.pill'); if (b) { bType = b.dataset.t; bSync(); } });
  $('bWho').addEventListener('click', (e) => { const b = e.target.closest('.pill'); if (b) { bWho = b.dataset.who; bSync(); } });
  $('bTabs').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    bFilter = b.dataset.f;
    [...$('bTabs').children].forEach(x => x.classList.toggle('on', x === b));
    renderBaul();
  });
  $('bUp').addEventListener('click', () => $('bFile').click());
  $('bFile').addEventListener('change', async () => {
    const f = $('bFile').files[0];
    if (!f) return;
    try { bImg = await fileToDataUrl(f, 720); bSync(); } catch {}
    $('bFile').value = '';
  });
  $('bRm').addEventListener('click', () => { bImg = ''; bSync(); });
  $('bSave').addEventListener('click', async () => {
    const title = $('bTitle').value.trim();
    const text = $('bText').value.trim();
    const st = $('bStatus');
    if (!title && !text && !bImg) {
      st.textContent = 'Agregá un título, un texto o una imagen.';
      st.classList.add('error');
      return;
    }
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    st.classList.remove('error');
    st.textContent = 'Guardando...';
    $('bSave').disabled = true;
    try {
      await baulRef.child(id).set({ id, type: bType, who: bWho, title, text, image: bImg, createdAt: Date.now() });
      bReset();
      $('bComp').hidden = true;
    } catch (err) {
      st.textContent = 'No se pudo guardar. Revisá la conexión o las reglas de Firebase para paraVer/baul.';
      st.classList.add('error');
    }
    $('bSave').disabled = false;
  });

  // --- Tablero de dibujo ---
  const pad = $('pad');
  const pctx = pad.getContext('2d');
  const PAD_BG = '#FFFDF8';
  const PAL = [['#3B2A35', 'Tinta'], ['#C94468', 'Rosa'], ['#7A6BC4', 'Lavanda'], ['#3E8E5B', 'Verde'], ['#E8A33D', 'Ámbar'], ['#4FA3D9', 'Celeste'], [PAD_BG, 'Goma']];
  let pColor = PAL[0][0], drawing = false, last = null, undoStack = [];
  PAL.forEach(([c, n], i) => {
    const b = el('button', 'sw' + (i === 0 ? ' on' : ''));
    b.type = 'button';
    b.style.background = c;
    b.setAttribute('aria-label', n);
    b.onclick = () => { pColor = c; [...$('pal').children].forEach(x => x.classList.toggle('on', x === b)); };
    $('pal').appendChild(b);
  });
  function padClear() { pctx.fillStyle = PAD_BG; pctx.fillRect(0, 0, pad.width, pad.height); }
  function padPos(e) {
    const r = pad.getBoundingClientRect();
    return { x: (e.clientX - r.left) * pad.width / r.width, y: (e.clientY - r.top) * pad.height / r.height };
  }
  function snap() { undoStack.push(pctx.getImageData(0, 0, pad.width, pad.height)); if (undoStack.length > 15) undoStack.shift(); }
  pad.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    pad.setPointerCapture(e.pointerId);
    snap();
    drawing = true;
    last = padPos(e);
    pctx.fillStyle = pColor;
    pctx.beginPath();
    pctx.arc(last.x, last.y, $('pSz').value / 2, 0, Math.PI * 2);
    pctx.fill();
  });
  pad.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const p = padPos(e);
    pctx.strokeStyle = pColor;
    pctx.lineWidth = Number($('pSz').value);
    pctx.lineCap = 'round';
    pctx.lineJoin = 'round';
    pctx.beginPath();
    pctx.moveTo(last.x, last.y);
    pctx.lineTo(p.x, p.y);
    pctx.stroke();
    last = p;
  });
  ['pointerup', 'pointercancel'].forEach(ev => pad.addEventListener(ev, () => { drawing = false; }));
  $('bDraw').addEventListener('click', () => { padClear(); undoStack = []; padDlg.showModal(); });
  $('pUndo').addEventListener('click', () => { if (undoStack.length) pctx.putImageData(undoStack.pop(), 0, 0); });
  $('pClear').addEventListener('click', () => { snap(); padClear(); });
  $('pCancel').addEventListener('click', () => padDlg.close());
  $('pDone').addEventListener('click', () => { bImg = pad.toDataURL('image/jpeg', .82); padDlg.close(); bSync(); });

  async function toggleSeen(id) {
    popId = id;
    items = items.map(i => i.id === id ? { ...i, seen: !i.seen } : i);
    render();
    const pb = document.querySelector('.item.seen .pop');
    if (pb) burst(pb);
    await persist();
  }

  async function setRating(id, n) {
    items = items.map(i => i.id === id ? { ...i, rating: n } : i);
    render();
    await persist();
  }

  async function removeItem(id) {
    items = items.filter(i => i.id !== id);
    render();
    await persist();
  }

  // Live sync: both Diego and Andro see updates instantly, no manual reload needed.
  itemsRef.on('value', (snapshot) => {
    const val = snapshot.val();
    items = val ? Object.values(val) : [];
    bannerEl.style.display = 'none';
    render();
  }, (err) => {
    bannerEl.style.display = 'block';
  });

  async function persist() {
    const obj = {};
    for (const item of items) obj[item.id] = item;
    try {
      await itemsRef.set(obj);
      statusEl.classList.remove('error');
      return true;
    } catch (err) {
      statusEl.textContent = 'No se pudo guardar. Revisá la conexión.';
      statusEl.classList.add('error');
      return false;
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = urlInput.value.trim();
    if (!url) return;

    submitBtn.disabled = true;
    statusEl.classList.remove('error');
    statusEl.textContent = 'Buscando vista previa...';

    const asText = currentCat === 'Juegos' && !looksLikeLink(url);
    const preview = asText ? { title: '', description: '', image: '' } : await fetchPreview(fixUrl(url));

    const newItem = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      url: asText ? url : fixUrl(url),
      isText: asText,
      coords: asText && COORD_RE.test(url),
      duration: asText ? 0 : Number(durInput.value) || 0,
      title: preview.title,
      description: preview.description,
      image: preview.image,
      note: noteInput.value.trim(),
      category: currentCat,
      addedBy: currentWho,
      addedAt: Date.now(),
      seen: false
    };
    items.push(newItem);
    render();
    urlInput.value = '';
    noteInput.value = '';
    durInput.value = '0';
    statusEl.textContent = 'Guardando...';
    const ok = await persist();
    if (ok) statusEl.textContent = '';
    submitBtn.disabled = false;
    urlInput.focus();
  });
</script>
</body>
</html>
