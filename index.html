<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ver</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root {
    --bg: #131316;
    --surface: #1b1b1f;
    --surface-2: #202024;
    --line: #29292e;
    --text: #eaeaec;
    --muted: #86868f;
    --accent: #9c6b4f;
    --accent-soft: #9c6b4f22;
    --warn: #b5654f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: 48px 20px 100px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }
  .banner {
    display: none;
    background: #b5654f18;
    border: 1px solid #b5654f55;
    color: #d7a08e;
    font-size: 13px;
    padding: 10px 13px;
    border-radius: 10px;
    margin-bottom: 20px;
    line-height: 1.4;
  }

  form {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 36px;
  }
  input {
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 11px 13px;
    border-radius: 9px;
    font-size: 14px;
    outline: none;
    width: 100%;
    font-family: inherit;
    transition: border-color 0.15s ease;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 11px 14px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button:hover { opacity: 0.88; }
  button:disabled { opacity: 0.5; cursor: default; }

  .who-select, .cat-select {
    display: flex;
    gap: 6px;
  }
  .pill {
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    flex: 1;
    text-align: center;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .pill.active { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

  .status { font-size: 13px; color: var(--muted); min-height: 16px; }
  .status.error { color: var(--warn); }

  .section { margin-bottom: 36px; }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .section-title { font-size: 15px; font-weight: 600; }
  .section-count { font-size: 12px; color: var(--muted); }

  .item {
    display: flex;
    gap: 12px;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .item.seen { opacity: 0.42; }

  .thumb {
    width: 76px;
    height: 76px;
    border-radius: 8px;
    background: var(--surface-2);
    flex-shrink: 0;
    object-fit: cover;
    display: block;
  }
  .thumb.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    padding: 4px;
  }

  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .title {
    font-size: 14px;
    font-weight: 500;
    margin: 0 0 3px;
    line-height: 1.3;
  }
  .item.seen .title { text-decoration: line-through; }
  a.title-link { color: var(--text); text-decoration: none; }
  a.title-link:hover { color: var(--accent); }
  .desc {
    font-size: 12.5px;
    color: var(--muted);
    margin: 0 0 6px;
    line-height: 1.4;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .note {
    font-size: 12.5px;
    color: var(--muted);
    font-style: italic;
    margin: 0 0 6px;
  }
  .meta { display: flex; gap: 8px; align-items: center; margin-top: auto; }
  .who {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 5px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .date { font-size: 11px; color: var(--muted); }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
    justify-content: space-between;
  }
  .check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .item.seen .check { background: var(--accent); border-color: var(--accent); }
  .check::after { content: ""; width: 8px; height: 8px; border-radius: 50%; }
  .item.seen .check::after { background: #fff; }
  .del {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    padding: 2px;
  }
  .del:hover { color: var(--accent); }

  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 14px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Para ver</h1>
  <p class="sub">Lista compartida de Diego &amp; Andro.</p>

  <div class="banner" id="storageBanner">
    No se pudo conectar con la base de datos. Revisa tu conexión o vuelve a cargar la página.
  </div>

  <form id="form">
    <div class="who-select" id="whoSelect">
      <button type="button" class="pill active" data-who="Diego">Diego</button>
      <button type="button" class="pill" data-who="Andro">Andro</button>
    </div>
    <div class="cat-select" id="catSelect">
      <button type="button" class="pill active" data-cat="Anime">Anime</button>
      <button type="button" class="pill" data-cat="YouTube">YouTube</button>
      <button type="button" class="pill" data-cat="Peliculas">Películas</button>
    </div>
    <input id="url" type="text" placeholder="Pega el enlace acá" required>
    <input id="noteInput" type="text" placeholder="Nota (opcional)">
    <button type="submit" id="submitBtn">Agregar</button>
    <div class="status" id="status"></div>
  </form>

  <div id="sections"></div>
</div>

<script>
  // --- Firebase setup ---
  const firebaseConfig = {
    apiKey: "AIzaSyDMVbDCxFJo5_J0wMoiNb4AVrZCiV4GFGc",
    authDomain: "para-ver-ce1b9.firebaseapp.com",
    databaseURL: "https://para-ver-ce1b9-default-rtdb.firebaseio.com",
    projectId: "para-ver-ce1b9",
    storageBucket: "para-ver-ce1b9.firebasestorage.app",
    messagingSenderId: "101656425888",
    appId: "1:101656425888:web:1fd31b060bbf21f6a3a0c5",
    measurementId: "G-3GJDE3H6L8"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const itemsRef = db.ref('paraVer/items');

  const CATEGORIES = ['Anime', 'YouTube', 'Peliculas'];
  const CAT_LABELS = { Anime: 'Anime', YouTube: 'YouTube', Peliculas: 'Películas' };
  let items = [];
  let currentWho = 'Diego';
  let currentCat = 'Anime';

  const sectionsEl = document.getElementById('sections');
  const statusEl = document.getElementById('status');
  const bannerEl = document.getElementById('storageBanner');
  const form = document.getElementById('form');
  const urlInput = document.getElementById('url');
  const noteInput = document.getElementById('noteInput');
  const whoSelect = document.getElementById('whoSelect');
  const catSelect = document.getElementById('catSelect');
  const submitBtn = document.getElementById('submitBtn');

  whoSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('.pill');
    if (!btn) return;
    currentWho = btn.dataset.who;
    [...whoSelect.children].forEach(b => b.classList.toggle('active', b === btn));
  });
  catSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('.pill');
    if (!btn) return;
    currentCat = btn.dataset.cat;
    [...catSelect.children].forEach(b => b.classList.toggle('active', b === btn));
  });

  function domainOf(url) {
    try { return new URL(url).hostname.replace('www.', ''); }
    catch { return url; }
  }

  function youtubeIdFrom(url) {
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  async function fetchPreview(url) {
    if (/youtu\.?be/.test(url)) {
      try {
        const res = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(url));
        if (res.ok) {
          const data = await res.json();
          const id = youtubeIdFrom(url);
          return {
            title: data.title || '',
            description: data.author_name ? 'YouTube · ' + data.author_name : '',
            image: data.thumbnail_url || (id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : '')
          };
        }
      } catch {}
      const id = youtubeIdFrom(url);
      if (id) return { title: '', description: '', image: `https://i.ytimg.com/vi/${id}/hqdefault.jpg` };
    }
    try {
      const res = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(url));
      const data = await res.json();
      if (data.status === 'success') {
        return {
          title: data.data.title || '',
          description: data.data.description || '',
          image: (data.data.image && data.data.image.url) || (data.data.logo && data.data.logo.url) || ''
        };
      }
    } catch {}
    return { title: '', description: '', image: '' };
  }

  function render() {
    sectionsEl.innerHTML = '';
    for (const cat of CATEGORIES) {
      const catItems = items.filter(i => i.category === cat).sort((a, b) => b.addedAt - a.addedAt);
      const section = document.createElement('div');
      section.className = 'section';

      const head = document.createElement('div');
      head.className = 'section-head';
      const titleEl = document.createElement('div');
      titleEl.className = 'section-title';
      titleEl.textContent = CAT_LABELS[cat];
      const countEl = document.createElement('div');
      countEl.className = 'section-count';
      countEl.textContent = catItems.length;
      head.appendChild(titleEl);
      head.appendChild(countEl);
      section.appendChild(head);

      if (!catItems.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Nada guardado todavía.';
        section.appendChild(empty);
      }

      for (const item of catItems) {
        const row = document.createElement('div');
        row.className = 'item' + (item.seen ? ' seen' : '');

        let thumb;
        if (item.image) {
          thumb = document.createElement('img');
          thumb.className = 'thumb';
          thumb.src = item.image;
          thumb.alt = '';
          thumb.onerror = () => { thumb.style.display = 'none'; };
        } else {
          thumb = document.createElement('div');
          thumb.className = 'thumb placeholder';
          thumb.textContent = domainOf(item.url);
        }

        const content = document.createElement('div');
        content.className = 'content';

        const title = document.createElement('p');
        title.className = 'title';
        const link = document.createElement('a');
        link.className = 'title-link';
        link.href = item.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = item.title || domainOf(item.url);
        title.appendChild(link);
        content.appendChild(title);

        if (item.description) {
          const desc = document.createElement('p');
          desc.className = 'desc';
          desc.textContent = item.description;
          content.appendChild(desc);
        }
        if (item.note) {
          const note = document.createElement('p');
          note.className = 'note';
          note.textContent = item.note;
          content.appendChild(note);
        }

        const meta = document.createElement('div');
        meta.className = 'meta';
        const who = document.createElement('span');
        who.className = 'who';
        who.textContent = item.addedBy;
        meta.appendChild(who);
        const date = document.createElement('span');
        date.className = 'date';
        date.textContent = new Date(item.addedAt).toLocaleDateString('es', { day: 'numeric', month: 'short' });
        meta.appendChild(date);
        content.appendChild(meta);

        const actions = document.createElement('div');
        actions.className = 'actions';
        const check = document.createElement('div');
        check.className = 'check';
        check.addEventListener('click', () => toggleSeen(item.id));
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = 'Eliminar';
        del.addEventListener('click', () => removeItem(item.id));
        actions.appendChild(check);
        actions.appendChild(del);

        row.appendChild(thumb);
        row.appendChild(content);
        row.appendChild(actions);
        section.appendChild(row);
      }

      sectionsEl.appendChild(section);
    }
  }

  // Live sync: both Diego and Andro see updates instantly, no manual reload needed.
  itemsRef.on('value', (snapshot) => {
    const val = snapshot.val();
    items = val ? Object.values(val) : [];
    bannerEl.style.display = 'none';
    render();
  }, (err) => {
    bannerEl.style.display = 'block';
  });

  async function persist() {
    const obj = {};
    for (const item of items) obj[item.id] = item;
    try {
      await itemsRef.set(obj);
      statusEl.classList.remove('error');
      return true;
    } catch (err) {
      statusEl.textContent = 'No se pudo guardar. Revisa la conexión.';
      statusEl.classList.add('error');
      return false;
    }
  }

  async function toggleSeen(id) {
    items = items.map(i => i.id === id ? { ...i, seen: !i.seen } : i);
    render();
    await persist();
  }

  async function removeItem(id) {
    items = items.filter(i => i.id !== id);
    render();
    await persist();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = urlInput.value.trim();
    if (!url) return;

    submitBtn.disabled = true;
    statusEl.classList.remove('error');
    statusEl.textContent = 'Buscando vista previa...';

    const preview = await fetchPreview(url);

    const newItem = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      url,
      title: preview.title,
      description: preview.description,
      image: preview.image,
      note: noteInput.value.trim(),
      category: currentCat,
      addedBy: currentWho,
      addedAt: Date.now(),
      seen: false
    };
    items.push(newItem);
    render();
    urlInput.value = '';
    noteInput.value = '';
    statusEl.textContent = 'Guardando...';
    const ok = await persist();
    if (ok) statusEl.textContent = '';
    submitBtn.disabled = false;
    urlInput.focus();
  });
</script>
</body>
</html>
